{{- if .Values.ingress.enabled }}
{{/* The status UI exposes operational data; protect this ingress with TLS and authentication. */}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "hetdns.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hetdns.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path | quote }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "hetdns.fullname" $ }}
                port:
                  number: {{ $.Values.service.port }}
          {{- end }}
    {{- end }}
{{- end }}
