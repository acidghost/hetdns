---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hetdns
  labels:
    app.kubernetes.io/name: hetdns
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hetdns
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hetdns
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hetdns
          image: ghcr.io/acidghost/hetdns:latest
          imagePullPolicy: IfNotPresent
          args:
            - -config=/etc/hetdns/config.json
            - -token-file=/run/secrets/hetdns/token
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          # OTLP is optional. Example:
          # env:
          #   - name: OTEL_EXPORTER_OTLP_ENDPOINT
          #     value: http://opentelemetry-collector.observability:4318
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 12
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              cpu: 200m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/hetdns
              readOnly: true
            - name: token
              mountPath: /run/secrets/hetdns
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: hetdns
        - name: token
          secret:
            secretName: hetdns-token
